name: lab
on:
  push:
    branches: [lab]
permissions:
  contents: write
jobs:
  bg:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: [anime, general, matting, hrmat, hr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install onnxruntime==1.22.0 numpy pillow
      - name: model
        run: |
          mkdir -p m && cd m
          R=https://github.com/ZhengPeng7/BiRefNet/releases/download/v1
          case "${{ matrix.model }}" in
            anime) curl -sSLf -o anime.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-anime.onnx ;;
            general) curl -sSLf -o general.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/BiRefNet-general-epoch_244.onnx ;;
            matting) curl -sSLf -o BiRefNet-matting-epoch_100.onnx $R/BiRefNet-matting-epoch_100.onnx ;;
            hrmat) curl -sSLf -o BiRefNet_HR-matting-epoch_135.onnx $R/BiRefNet_HR-matting-epoch_135.onnx ;;
            hr) curl -sSLf -o BiRefNet_HR-general-epoch_130.onnx $R/BiRefNet_HR-general-epoch_130.onnx ;;
          esac
          ls -la
      - name: run
        run: |
          mkdir -p out
          for f in in/*; do python lab.py ${{ matrix.model }} "$f" 2>&1 | tee -a out/log-${{ matrix.model }}.txt || true; done
      - name: push results
        if: ${{ always() }}
        run: |
          mkdir -p out && cd out && git init -q -b lab-out-${{ matrix.model }} && git add -A && git -c user.name=ci -c user.email=ci@7krh.dev commit -q -m "lab ${GITHUB_RUN_ID}" --allow-empty
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" lab-out-${{ matrix.model }}
