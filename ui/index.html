<head>

<title>7krh Studio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/></symbol>
    <symbol id="i-timeline" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><rect x="5.5" y="11.5" width="7" height="2.6" rx="1"/><rect x="9.5" y="15.5" width="9" height="2.6" rx="1"/><path d="M14 2.5v19"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.8"/><path d="m4 18 5.5-5.5 3.5 3.5 2.5-2.5L20 18"/></symbol>

    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h5l2 2h8A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5 12 14l4.5-4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" class="fill"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1" class="fill"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1" class="fill"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 6 9 12l6 6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-start" viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" class="fill"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></symbol>
    <symbol id="i-tiktok" viewBox="0 0 24 24"><path class="fill" d="M16.6 3c.4 2.2 1.9 3.8 4.1 4v3.1c-1.5 0-2.9-.4-4.1-1.2v6.4c0 3.3-2.7 5.7-5.9 5.7S4.8 18.6 4.8 15.4c0-3.4 2.9-6 6.4-5.7v3.2c-1.6-.4-3.2.8-3.2 2.4 0 1.4 1.1 2.5 2.6 2.5 1.6 0 2.7-1.1 2.7-2.9V3z"/></symbol>
    <symbol id="i-insta" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" class="fill"/></symbol>
    <symbol id="i-yt" viewBox="0 0 24 24"><path class="fill" d="M21.6 7.2a2.6 2.6 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4a2.6 2.6 0 0 0-1.8 1.8C2 8.8 2 12 2 12s0 3.2.4 4.8a2.6 2.6 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.6 2.6 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.2 3z"/></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3.5c-.8 1 .8 2 0 3M12 3.5c-.8 1 .8 2 0 3"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.2 7.5 20 17M8.2 16.5 20 7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6.5V5h14v1.5M12 5v14M9 19h6"/></symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M5 4h4v8a3 3 0 0 0 6 0V4h4v8a7 7 0 0 1-14 0z"/><path d="M5 8h4M15 8h4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.6A10 10 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.7M6.6 6.6C3.9 8.4 2.5 12 2.5 12S6 18.5 12 18.5a9.6 9.6 0 0 0 4.4-1"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-diamond" viewBox="0 0 24 24"><path d="M12 3.5 20.5 12 12 20.5 3.5 12z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16.5" rx="2"/><path d="M9 4.5V3h6v1.5M9 11h6M9 15h4"/></symbol>
    <symbol id="i-zin" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5M8 10.5h5M10.5 8v5"/></symbol>
    <symbol id="i-zout" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5M8 10.5h5"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.3"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5z"/><path d="m3 12.5 9 5 9-5M3 17l9 5 9-5"/></symbol>
    <symbol id="i-sub" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 13.5h4M13 13.5h4M7 16.5h7"/></symbol>
    <symbol id="i-dup" viewBox="0 0 24 24"><rect x="4" y="7" width="10" height="10" rx="1.5"/><rect x="10" y="4" width="10" height="10" rx="1.5"/></symbol>
    <symbol id="i-detach" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><path d="M5 17h1.5M8.5 15v4M12 14v6M15.5 15.5v3M19 17h-1"/></symbol>
  </defs>
</svg>

<header class="titlebar">
  <div class="brand"><img src="img/logo-128.png" alt=""><b>7krh</b><span>Studio</span><small id="ver"></small></div>
  <span class="crumb" id="crumb"></span>
  <button class="coffee" id="coffee" title=""><svg class="ic"><use href="#i-coffee"/></svg><span data-i="coffee"></span></button>
</header>

<div class="app">
  <aside class="side" id="side">
    <button class="nav on" data-v="home"><svg class="ic"><use href="#i-home"/></svg><span data-i="nav_home"></span></button>
    <button class="nav" data-v="edit"><svg class="ic"><use href="#i-timeline"/></svg><span data-i="nav_edit"></span></button>
    <button class="nav" data-v="enhance"><svg class="ic"><use href="#i-film"/></svg><span data-i="nav_enhance"></span></button>
    <button class="nav" data-v="images"><svg class="ic"><use href="#i-image"/></svg><span data-i="nav_images"></span></button>
    <button class="nav" data-v="audio"><svg class="ic"><use href="#i-wave"/></svg><span data-i="nav_audio"></span></button>
    <button class="nav" data-v="projects"><svg class="ic"><use href="#i-folder"/></svg><span data-i="nav_projects"></span></button>
    <div class="sp"></div>
    <button class="nav" data-v="queue"><svg class="ic"><use href="#i-queue"/></svg><span data-i="nav_queue"></span><span class="badge" id="qBadge" hidden>0</span></button>
    <button class="nav" data-v="settings"><svg class="ic"><use href="#i-gear"/></svg><span data-i="nav_settings"></span></button>
  </aside>

  <main class="main">
    <!-- HOME -->
    <section class="view" id="v-home">
      <div class="home">
        <div class="hcol">
          <div class="hero">
            <h1 class="h1" data-i="home_hello"></h1>
            <p class="lead" data-i="home_sub"></p>
            <button class="drop" id="homeDrop">
              <svg class="ic"><use href="#i-upload"/></svg>
              <strong data-i="home_drop"></strong>
              <span data-i="home_drop_sub"></span>
            </button>
          </div>
          <div class="cards">
            <button class="card" data-go="edit"><div class="ic2"><svg class="ic"><use href="#i-timeline"/></svg></div><b data-i="card_edit"></b><p data-i="card_edit_sub"></p></button>
            <button class="card" data-go="enhance"><div class="ic2"><svg class="ic"><use href="#i-spark"/></svg></div><b data-i="card_enh"></b><p data-i="card_enh_sub"></p></button>
            <button class="card" data-go="images"><div class="ic2"><svg class="ic"><use href="#i-image"/></svg></div><b data-i="card_img"></b><p data-i="card_img_sub"></p></button>
            <button class="card" data-go="audio"><div class="ic2"><svg class="ic"><use href="#i-wave"/></svg></div><b data-i="card_aud"></b><p data-i="card_aud_sub"></p></button>
          </div>
          <div class="recentBox" id="homeRecent" hidden><h3 data-i="recent"></h3><div class="recent" id="homeRecentList"></div></div>
        </div>
        <div class="panel hw">
          <h3 data-i="hw_title"></h3>
          <div class="gpu"><div class="chipico" id="gpuIco"><svg class="ic"><use href="#i-chip"/></svg></div><div><b id="gpuName">—</b><small id="gpuSub"></small></div></div>
          <div class="kv">
            <span data-i="hw_ai"></span><b id="hwAi">—</b>
            <span data-i="hw_enc"></span><b id="hwEnc">—</b>
            <span data-i="hw_cpu"></span><b id="hwCpu">—</b>
            <span data-i="hw_ram"></span><b id="hwRam">—</b>
          </div>
          <div class="hint warn" id="rtBad" hidden data-i="hw_rt_bad"></div>
          <div class="bench" id="benchBox" hidden></div>
          <div class="hint" id="benchAsk" hidden data-i="bench_ask"></div>
          <button class="btn sm" id="benchBtn" style="margin-top:12px;width:100%"><svg class="ic"><use href="#i-spark"/></svg><span data-i="hw_bench"></span></button>
        </div>
      </div>
    </section>

    <!-- MONTAGE (timeline editor) -->
    <section class="view full" id="v-edit" hidden>
      <div class="ed">
        <div class="ed-top">
          <aside class="bin">
            <div class="bin-tabs"><button class="on" data-bt="media" data-i="bin_media"></button><button data-bt="text" data-i="bin_text"></button><button data-bt="trans" data-i="bin_trans"></button></div>
            <div class="bin-pane" id="bp-media">
              <div class="bin-acts"><button class="btn sm primary" id="binImport"><svg class="ic"><use href="#i-plus"/></svg><span data-i="bin_import"></span></button><button class="btn sm" id="binSubs" title=""><svg class="ic"><use href="#i-sub"/></svg><span data-i="bin_subs"></span></button></div>
              <div class="bin-list" id="binList"><div class="empty sm" id="binEmpty"><svg class="ic"><use href="#i-upload"/></svg><span data-i="bin_empty"></span></div></div>
            </div>
            <div class="bin-pane" id="bp-text" hidden>
              <div class="tpresets" id="textPresets"></div>
            </div>
            <div class="bin-pane" id="bp-trans" hidden>
              <p class="hint" data-i="trans_hint"></p>
              <div class="tgrid" id="transList"></div>
            </div>
          </aside>
          <div class="stage">
            <div class="stagebar">
              <span class="pname" id="pName" contenteditable="plaintext-only" spellcheck="false"></span>
              <span class="tag" id="pCanvas"></span>
              <span class="sp"></span>
              <button class="btn sm ghost" id="pSettingsBtn"><svg class="ic"><use href="#i-gear"/></svg><span data-i="p_settings"></span></button>
              <button class="btn sm" id="pSave"><svg class="ic"><use href="#i-save"/></svg><span data-i="save"></span></button>
              <button class="btn sm primary" id="pExport"><svg class="ic"><use href="#i-queue"/></svg><span data-i="export"></span></button>
            </div>
            <div class="viewer" id="viewer"><canvas id="pv"></canvas><div class="vempty" id="pvEmpty"><svg class="ic"><use href="#i-timeline"/></svg><strong data-i="ed_empty"></strong><span data-i="ed_empty_sub"></span></div><div class="busy" id="pvBusy" hidden><div class="spin"></div><span id="pvBusyTxt"></span></div></div>
            <div class="transport">
              <button class="icbtn" id="tStart" title=""><svg class="ic"><use href="#i-start"/></svg></button>
              <button class="icbtn" id="tPrev"><svg class="ic"><use href="#i-prev"/></svg></button>
              <button class="icbtn play" id="tPlay"><svg class="ic"><use href="#i-play"/></svg></button>
              <button class="icbtn" id="tNext"><svg class="ic"><use href="#i-next"/></svg></button>
              <span class="time" id="tTime">0:00.00 / 0:00.00</span>
              <span class="sp"></span>
              <span class="pvq"><span data-i="pv_quality"></span><select id="pvScale"><option value="1" data-i="pv_full"></option><option value="0.5" selected data-i="pv_half"></option><option value="0.25" data-i="pv_quarter"></option></select></span>
            </div>
          </div>
          <aside class="insp" id="insp"></aside>
        </div>
        <div class="ed-bottom" id="edBottom">
          <div class="tlbar">
            <button class="icbtn sm" id="eUndo" title=""><svg class="ic"><use href="#i-undo"/></svg></button>
            <button class="icbtn sm" id="eRedo" title=""><svg class="ic"><use href="#i-redo"/></svg></button>
            <i class="vsep"></i>
            <button class="icbtn sm" id="eSplit" title=""><svg class="ic"><use href="#i-split"/></svg></button>
            <button class="icbtn sm" id="eDel" title=""><svg class="ic"><use href="#i-trash"/></svg></button>
            <button class="icbtn sm" id="eDup" title=""><svg class="ic"><use href="#i-dup"/></svg></button>
            <button class="icbtn sm" id="eDetach" title=""><svg class="ic"><use href="#i-detach"/></svg></button>
            <button class="icbtn sm" id="eCopyFx" title=""><svg class="ic"><use href="#i-copy"/></svg></button>
            <button class="icbtn sm" id="ePasteFx" title=""><svg class="ic"><use href="#i-paste"/></svg></button>
            <i class="vsep"></i>
            <button class="icbtn sm" id="eText" title=""><svg class="ic"><use href="#i-text"/></svg></button>
            <button class="icbtn sm toggle-on" id="eSnap" title=""><svg class="ic"><use href="#i-magnet"/></svg></button>
            <button class="icbtn sm toggle-on" id="eRipple" title=""><svg class="ic"><use href="#i-layers"/></svg></button>
            <span class="sp"></span>
            <span class="hint inl" id="tlHint"></span>
            <button class="icbtn sm" id="eZout"><svg class="ic"><use href="#i-zout"/></svg></button>
            <input type="range" id="eZoom" min="0" max="100" value="40">
            <button class="icbtn sm" id="eZin"><svg class="ic"><use href="#i-zin"/></svg></button>
          </div>
          <div class="tl" id="tl">
            <div class="tl-heads" id="tlHeads"></div>
            <div class="tl-scroll" id="tlScroll">
              <div class="tl-inner" id="tlInner">
                <div class="ruler" id="ruler"></div>
                <div class="tracks" id="tracks"></div>
                <div class="playhead" id="playhead"><i></i></div>
                <div class="snapline" id="snapline" hidden></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- VIDEO ENHANCE (single clip) -->
    <section class="view full" id="v-enhance" hidden>
      <div class="editor">
        <div class="stage">
          <div class="ehead">
            <span class="name" id="eName"></span>
            <div class="tags" id="eTags"></div>
            <span class="sp"></span>
            <button class="btn sm" id="eOpen"><svg class="ic"><use href="#i-folder"/></svg><span data-i="open_video"></span></button>
          </div>
          <div class="player" id="player">
            <div class="empty" id="eEmpty"><svg class="ic"><use href="#i-film"/></svg><strong data-i="enh_drop"></strong><button class="btn primary" id="eOpen2" data-i="open_video"></button></div>
            <video id="vid" hidden preload="auto" playsinline></video>
            <div class="cmp" id="cmp" hidden><canvas id="cmpCv"></canvas><span class="lbl2 l" data-i="before"></span><span class="lbl2 r" data-i="after"></span>
              <div class="zoombar"><button class="btn sm ghost" data-z="0" data-i="z_fit"></button><button class="btn sm ghost" data-z="1">100%</button><button class="btn sm ghost" data-z="2">200%</button><span id="cmpZoom">100%</span><span class="zhint" data-i="z_hint"></span></div>
              <button class="icbtn pclose" id="cmpClose"><svg class="ic"><use href="#i-x"/></svg></button></div>
            <div class="busy" id="pBusy" hidden><div class="spin"></div><span id="pBusyTxt"></span></div>
          </div>
          <div class="transport">
            <button class="icbtn" id="vPrev"><svg class="ic"><use href="#i-prev"/></svg></button>
            <button class="icbtn play" id="vPlay"><svg class="ic"><use href="#i-play"/></svg></button>
            <button class="icbtn" id="vNext"><svg class="ic"><use href="#i-next"/></svg></button>
            <span class="time" id="vTime">0:00.00 / 0:00.00</span>
            <span class="sp"></span>
            <button class="btn sm ai" id="aiPrev"><svg class="ic"><use href="#i-spark"/></svg><span data-i="ai_preview"></span></button>
          </div>
          <div class="trim">
            <div class="trimbar" id="trimbar"><div class="thumbs" id="vthumbs"></div><div class="shade" id="shL"></div><div class="shade" id="shR"></div><div class="sel" id="tsel"></div><div class="h" id="hIn"></div><div class="h" id="hOut"></div><div class="ph" id="vph"></div></div>
          </div>
        </div>
        <div class="insp">

            <div class="seg" id="methodSeg"><button data-v="encode" class="on" data-i="m_encode"></button><button data-v="copy" data-i="m_copy"></button></div>

              <div class="field"><div class="lbl"><span data-i="sharpen"></span><b id="v-sh">0</b></div><input type="range" min="0" max="100" value="0" data-adj="sh"></div>

              <div id="musicBox" hidden>

              </div>
              <div class="field" id="volBox"><div class="lbl"><span data-i="a_vol"></span><b id="v-vol">100%</b></div><input type="range" min="0" max="200" value="100" id="vol"></div>
            </div>
          </div>
          <div class="ipane" id="p-ai" hidden>

              <label class="toggle"><input type="checkbox" id="upOn"><span class="sw"></span><span><b data-i="ai_up"></b><small data-i="ai_up_sub"></small></span></label>
              <div class="field"><label data-i="ai_model"></label><div class="seg" id="upModel"><button data-v="real" class="on" data-i="m_real"></button><button data-v="anime" data-i="m_anime"></button></div></div>
              <div class="field"><label data-i="ai_q"></label><div class="seg" id="upQ"><button data-v="fast" data-i="aq_fast"></button><button data-v="balanced" class="on" data-i="aq_bal"></button><button data-v="max" data-i="aq_max"></button></div></div>

              <div class="hint" id="upInfo"></div>
            </div>

              <label class="toggle"><input type="checkbox" id="fgOn"><span class="sw"></span><span><b data-i="ai_fg"></b><small data-i="ai_fg_sub"></small></span></label>

              </div>

            <div class="sect">
              <h4 data-i="platform"></h4>
              <div class="plats" id="plats" style="margin-top:10px">

                <button class="plat" data-p="tiktok"><svg class="ic"><use href="#i-tiktok"/></svg><span data-i="p_tiktok"></span></button>

                <button class="plat" data-p="youtube"><svg class="ic"><use href="#i-yt"/></svg><span data-i="p_youtube"></span></button>
              </div>
              <div class="hint" id="platHint"></div>
              <div id="tikBox" hidden>
                <div class="field" id="techRow"><label data-i="techL"></label><select id="tech"><option value="krypton" data-i="tKr"></option><option value="patch" data-i="tPa"></option></select></div>

                <div class="hint" id="fxHint"></div>

              <span data-i="o_dur"></span><b id="oDur">—</b>
              <span data-i="o_enc"></span><b id="oEnc">—</b>
            </div>
            <div class="hint err" id="oErr" hidden></div>
            <button class="btn primary lg" id="exportBtn" style="width:100%" disabled><svg class="ic"><use href="#i-queue"/></svg><span data-i="export"></span></button>

      <div class="split">
        <div class="flist">
          <div class="top"><button class="btn sm primary" id="imgAdd"><svg class="ic"><use href="#i-plus"/></svg><span data-i="img_add"></span></button><button class="btn sm ghost" id="imgClear" data-i="img_clear"></button></div>
          <div class="items" id="imgList"></div>
        </div>
        <div class="canvasWrap">
          <div class="cv" id="imgCv"><div class="empty" id="imgEmpty"><svg class="ic"><use href="#i-image"/></svg><strong data-i="img_drop"></strong><span data-i="img_drop_sub"></span></div><canvas id="imgCanvas" hidden></canvas><span class="lbl2 l" id="imgLblA" hidden data-i="before"></span><span class="lbl2 r" id="imgLblB" hidden data-i="after"></span>
            <div class="zoombar" id="imgZoomBar" hidden><button class="btn sm ghost" data-z="0" data-i="z_fit"></button><button class="btn sm ghost" data-z="1">100%</button><button class="btn sm ghost" data-z="2">200%</button><span id="imgZoom">100%</span><span class="zhint" data-i="z_hint"></span></div><div class="busy" id="imgBusy" hidden><div class="spin"></div><span id="imgBusyTxt"></span><button class="btn sm" id="imgCancel" data-i="cancel"></button></div></div>

          <div class="sep"></div>
          <button class="btn primary lg" id="imgGo" style="width:100%" disabled><svg class="ic"><use href="#i-spark"/></svg><span data-i="img_go"></span></button>
          <div class="hint" id="imgHint"></div>

            <div class="field"><label data-i="aud_denoise"></label><select id="audDen"><option value="off" data-i="dn_off"></option><option value="light" data-i="dn_light"></option><option value="ai" data-i="dn_ai"></option></select></div>
